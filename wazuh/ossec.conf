<ossec_config>
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Nomadik Sentinel Log Ingestion -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nomadik_sentinel/traffic.log</location>
  </localfile>
</ossec_config>

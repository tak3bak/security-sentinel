name: "Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=spiderfoot/,test/,.venv/
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=spiderfoot/,test/,.venv/

    - name: Run Bandit (Security Baseline)
      run: |
        bandit -r . -ll -ii -x spiderfoot/,test/,.venv/

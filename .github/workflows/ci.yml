name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating Docker Compose file syntax and configuration..."
          docker compose config --quiet

      - name: Run Additional CI Checks
        run: |
          echo "Running test suites and security compliance scripts..."

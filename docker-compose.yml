services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nomadik-sentinel-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      telemetry-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/api/v1/telemetry/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    networks:
      - sentinel-net

  certbot:
    image: certbot/certbot:latest
    container_name: nomadik-sentinel-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - sentinel-net

  telemetry-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomadik-security-sentinel
    restart: unless-stopped
    expose:
      - "10000"
    environment:
      - PORT=10000
      - PYTHONUNBUFFERED=1
      - SENTINEL_DB_PATH=/app/data/telemetry_events.db
      - SENTINEL_RULES_DIR=/app/rules
      - SENTINEL_BATCH_SIZE=350
      - SENTINEL_BATCH_WINDOW_MS=50
      - SENTINEL_MAX_BUFFER_SIZE=100000
      - SENTINEL_WATCHER_INTERVAL=1.5
    volumes:
      - sentinel-storage:/app/data
      - ./rules:/app/rules:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:10000/api/v1/telemetry/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - sentinel-net

volumes:
  sentinel-storage:
    name: nomadik-sentinel-storage

networks:
  sentinel-net:
    name: nomadik-sentinel-net
    driver: bridge

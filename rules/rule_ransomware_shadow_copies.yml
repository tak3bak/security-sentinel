rule_id: "SIGMA-004-EXT"
title: "Ransomware Inhibit Recovery via VSSAdmin Shadow Deletion"
severity: "CRITICAL"
mitre_tag: "T1490"
event_type: "sysmon_process_create"
field_matches:
  process:
    - "vssadmin.exe"
    - "wmic.exe"
    - "wbadmin.exe"
regex_matches:
  command_line: "(delete\\s+shadows|shadowstorage|catalog\\s+-quiet)"

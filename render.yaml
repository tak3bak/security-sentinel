services:
  - type: web
    name: security-sentinel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/telemetry/health
    disk:
      name: sentinel-storage
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
